[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zomato-recommender"
version = "0.1.0"
description = "AI-powered restaurant recommendation system (Zomato use case)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zomato Project" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# Declared early; installed/used in later phases
data = [
  "datasets>=2.18",
  "pandas>=2.2",
  "pyarrow>=15.0",
]
llm = [
  # OpenAI-compatible SDK pointed at Groq (https://api.groq.com/openai/v1)
  "openai>=1.30",
  "pandas>=2.2",
]
ui = [
  "streamlit>=1.32",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]
all = [
  "zomato-recommender[dev,data,llm,ui,api]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
